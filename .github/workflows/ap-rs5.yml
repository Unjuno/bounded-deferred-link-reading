name: AP-RS5 real anchor context causal policy

on:
  push:
    branches: [main]
    paths:
      - 'experiments/ap_rs5_real_anchor_context_policy.py'
      - '.github/workflows/ap-rs5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ap-rs5:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy beautifulsoup4 lxml sentence-transformers scikit-learn
      - name: Run AP-RS5
        run: python experiments/ap_rs5_real_anchor_context_policy.py
      - name: Stage results
        run: |
          cp artifacts/ap_rs5/AP_RS5_RESULTS.json results/AP_RS5_RESULTS.json
          cp artifacts/ap_rs5/AP_RS5_SUMMARY.md docs/AP_RS5_SUMMARY.md
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add results/AP_RS5_RESULTS.json docs/AP_RS5_SUMMARY.md
          git diff --cached --quiet || git commit -m "Add AP-RS5 real anchor-context policy results"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: ap-rs5-results
          path: artifacts/ap_rs5/
          if-no-files-found: error
