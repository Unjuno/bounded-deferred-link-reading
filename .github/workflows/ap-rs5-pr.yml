name: AP-RS5 monitored PR run

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/ap_rs5_real_anchor_context_policy.py'
      - '.github/workflows/ap-rs5-pr.yml'

permissions:
  contents: read

jobs:
  ap-rs5-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy beautifulsoup4 lxml sentence-transformers scikit-learn
      - name: Run AP-RS5
        run: python experiments/ap_rs5_real_anchor_context_policy.py
      - uses: actions/upload-artifact@v4
        with:
          name: ap-rs5-monitored-results
          path: artifacts/ap_rs5/
          if-no-files-found: error
