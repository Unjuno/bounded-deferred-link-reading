name: AP-RS6 monitored PR run

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/ap_rs6_visible_only_policy.py'
      - '.github/workflows/ap-rs6-pr.yml'

# Fresh monitoring-only branch from current main; experimental conditions unchanged.
permissions:
  contents: read

jobs:
  ap-rs6-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy beautifulsoup4 lxml sentence-transformers scikit-learn
      - name: Run AP-RS6
        run: python -m experiments.ap_rs6_visible_only_policy
      - uses: actions/upload-artifact@v4
        with:
          name: ap-rs6-monitored-results
          path: |
            artifacts/ap_rs6/AP_RS6_RESULTS.json
            artifacts/ap_rs6/AP_RS6_SUMMARY.md
            artifacts/ap_rs6/test_rows.csv
          if-no-files-found: error
