name: AP-RS14 monitored robust sparse trigger

# monitored run trigger 2
on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/ap_rs14_robust_sparse_k1_trigger.py'
      - '.github/workflows/ap-rs14-pr.yml'

permissions:
  contents: read

jobs:
  ap-rs14-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy beautifulsoup4 lxml sentence-transformers scikit-learn
      - name: Run AP-RS14
        run: PYTHONPATH=. python experiments/ap_rs14_robust_sparse_k1_trigger.py
      - uses: actions/upload-artifact@v4
        with:
          name: ap-rs14-monitored-results
          path: artifacts/ap_rs14/
          if-no-files-found: error
