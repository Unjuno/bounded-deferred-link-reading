name: AP-RS10 bounded visited-memory audit

on:
  push:
    branches: [main]
    paths:
      - 'experiments/ap_rs10_bounded_visited_memory_audit.py'
      - '.github/workflows/ap-rs10.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ap-rs10:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy beautifulsoup4 lxml sentence-transformers
      - name: Run AP-RS10
        run: python -m experiments.ap_rs10_bounded_visited_memory_audit
      - name: Stage results
        run: |
          cp artifacts/ap_rs10/AP_RS10_RESULTS.json results/AP_RS10_RESULTS.json
          cp artifacts/ap_rs10/AP_RS10_SUMMARY.md docs/AP_RS10_SUMMARY.md
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/AP_RS10_RESULTS.json docs/AP_RS10_SUMMARY.md
          git diff --cached --quiet || git commit -m "Add AP-RS10 bounded visited-memory results"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: ap-rs10-results
          path: |
            artifacts/ap_rs10/AP_RS10_RESULTS.json
            artifacts/ap_rs10/AP_RS10_SUMMARY.md
          if-no-files-found: error
