name: AP-RS9 wrong-turn-triggered visible policy

on:
  push:
    branches: [main]
    paths:
      - 'experiments/ap_rs9_wrong_turn_triggered_policy.py'
      - '.github/workflows/ap-rs9.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ap-rs9:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy beautifulsoup4 lxml sentence-transformers scikit-learn
      - name: Run AP-RS9
        run: python -m experiments.ap_rs9_wrong_turn_triggered_policy
      - name: Stage results
        run: |
          cp artifacts/ap_rs9/AP_RS9_RESULTS.json results/AP_RS9_RESULTS.json
          cp artifacts/ap_rs9/AP_RS9_SUMMARY.md docs/AP_RS9_SUMMARY.md
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189822+github-actions[bot]@users.noreply.github.com"
          git add results/AP_RS9_RESULTS.json docs/AP_RS9_SUMMARY.md
          git diff --cached --quiet || git commit -m "Add AP-RS9 wrong-turn policy results"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: ap-rs9-results
          path: |
            artifacts/ap_rs9/AP_RS9_RESULTS.json
            artifacts/ap_rs9/AP_RS9_SUMMARY.md
            artifacts/ap_rs9/test_rows.csv
          if-no-files-found: error
