name: AP-LM1 monitored recursive query

on:
  pull_request:
    paths:
      - 'docs/AP_LM1_RECURSIVE_QUERY_PLAN.md'
      - 'experiments/ap_lm1_recursive_query_frontier.py'
      - '.github/workflows/ap-lm1-pr.yml'

permissions:
  contents: read

jobs:
  ap-lm1-monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scikit-learn
      - name: Run AP-LM1
        run: PYTHONPATH=. python experiments/ap_lm1_recursive_query_frontier.py
      - uses: actions/upload-artifact@v4
        with:
          name: ap-lm1-monitored-results
          path: |
            artifacts/ap_lm1/AP_LM1_RESULTS.json
            artifacts/ap_lm1/AP_LM1_SUMMARY.md
          if-no-files-found: error
