name: AP-RS8 anchor-only bounded deferred policy

on:
  push:
    branches: [main]
    paths:
      - 'experiments/ap_rs8_anchor_only_deferred_policy.py'
      - '.github/workflows/ap-rs8.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ap-rs8:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy beautifulsoup4 lxml sentence-transformers scikit-learn
      - name: Run AP-RS8
        run: python -m experiments.ap_rs8_anchor_only_deferred_policy
      - name: Stage results
        run: |
          cp artifacts/ap_rs8/AP_RS8_RESULTS.json results/AP_RS8_RESULTS.json
          cp artifacts/ap_rs8/AP_RS8_SUMMARY.md docs/AP_RS8_SUMMARY.md
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/AP_RS8_RESULTS.json docs/AP_RS8_SUMMARY.md
          git diff --cached --quiet || git commit -m "Add AP-RS8 anchor-only deferred results"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: ap-rs8-results
          path: artifacts/ap_rs8/
          if-no-files-found: error
