name: AP-LM4A generative answer-tree pilot

on:
  pull_request:
    paths:
      - 'experiments/ap_lm4a_generative_tree.py'
      - 'prereg/AP_LM4A_GENERATIVE_TREE_PILOT.md'
      - '.github/workflows/ap-lm4a-pilot.yml'
      - '.github/workflows/ap-lm3b-pr.yml'

permissions:
  contents: read

jobs:
  ap-lm4a-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install numpy pandas beautifulsoup4 lxml 'transformers>=4.46,<5' 'sentence-transformers>=3.2,<6' scikit-learn
      - name: Run AP-LM4A development pilot
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
          PYTHONPATH: '.'
        run: python experiments/ap_lm4a_generative_tree.py
      - name: Upload pilot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ap-lm4a-pilot-results
          path: |
            artifacts/ap_lm4a/AP_LM4A_PILOT_RESULTS.json
            artifacts/ap_lm4a/AP_LM4A_PILOT_SUMMARY.md
            artifacts/ap_lm4a/AP_LM4A_FROZEN_TREES.jsonl.gz
          if-no-files-found: error
