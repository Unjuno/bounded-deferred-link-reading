name: AP-RS3 complete title semantic replication

on:
  push:
    branches: [main]
    paths:
      - 'experiments/ap_rs3_complete_title_semantic_replication.py'
      - '.github/workflows/ap-rs3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ap-rs3:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy sentence-transformers
      - name: Run AP-RS3
        run: python experiments/ap_rs3_complete_title_semantic_replication.py
      - name: Stage results
        run: |
          cp artifacts/ap_rs3/AP_RS3_RESULTS.json results/AP_RS3_RESULTS.json
          cp artifacts/ap_rs3/AP_RS3_SUMMARY.md docs/AP_RS3_SUMMARY.md
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/AP_RS3_RESULTS.json docs/AP_RS3_SUMMARY.md
          git diff --cached --quiet || git commit -m "Add AP-RS3 complete-title semantic results"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: ap-rs3-results
          path: artifacts/ap_rs3/
          if-no-files-found: error
