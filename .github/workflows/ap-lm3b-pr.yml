name: AP-LM3B visible-query-cost pilot

on:
  pull_request:
    paths:
      - 'experiments/ap_lm3b_visible_query_cost.py'
      - 'docs/AP_LM3B_VISIBLE_QUERY_COST_PLAN.md'
      - '.github/workflows/ap-lm3b-pr.yml'

permissions:
  contents: read

jobs:
  ap-lm3b-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install numpy pandas beautifulsoup4 lxml sentence-transformers scikit-learn
      - name: Run AP-LM3B development pilot
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: PYTHONPATH=. python experiments/ap_lm3b_visible_query_cost.py
      - name: Upload pilot artifact
        uses: actions/upload-artifact@v4
        with:
          name: ap-lm3b-pilot-results
          path: |
            artifacts/ap_lm3b/AP_LM3B_PILOT_RESULTS.json
            artifacts/ap_lm3b/AP_LM3B_PILOT_SUMMARY.md
          if-no-files-found: error
