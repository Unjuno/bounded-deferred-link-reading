name: AP-RS13 monitored K1 semantic trigger

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/ap_rs13_k1_trigger_semantic_state.py'
      - '.github/workflows/ap-rs13-pr.yml'

permissions:
  contents: read

jobs:
  ap-rs13-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pandas beautifulsoup4 lxml sentence-transformers scikit-learn
      - name: Run AP-RS13
        run: python -m experiments.ap_rs13_k1_trigger_semantic_state
      - uses: actions/upload-artifact@v4
        with:
          name: ap-rs13-monitored-results
          path: |
            artifacts/ap_rs13/AP_RS13_RESULTS.json
            artifacts/ap_rs13/AP_RS13_SUMMARY.md
          if-no-files-found: error
