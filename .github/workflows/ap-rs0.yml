name: AP-RS0 real-title semantic progress

on:
  push:
    branches: [main]
    paths:
      - 'experiments/ap_rs0_title_semantic_progress.py'
      - '.github/workflows/ap-rs0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ap-rs0:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis dependencies
        run: python -m pip install --upgrade pip pandas numpy
      - name: Run preregistered AP-RS0
        run: python experiments/ap_rs0_title_semantic_progress.py
      - name: Stage public AP-RS0 outputs
        run: |
          cp artifacts/ap_rs0/AP_RS0_RESULTS.json results/AP_RS0_RESULTS.json
          cp artifacts/ap_rs0/AP_RS0_SUMMARY.md docs/AP_RS0_SUMMARY.md
      - name: Commit reproducible results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/AP_RS0_RESULTS.json docs/AP_RS0_SUMMARY.md
          git diff --cached --quiet || git commit -m "Add AP-RS0 real-title semantic results"
          git push
      - name: Upload AP-RS0 results
        uses: actions/upload-artifact@v4
        with:
          name: ap-rs0-results
          path: artifacts/ap_rs0/
          if-no-files-found: error
