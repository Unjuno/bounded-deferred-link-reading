name: AP-RS0 real-title semantic progress

on:
  push:
    branches: [main]
    paths:
      - 'experiments/ap_rs0_title_semantic_progress.py'
      - '.github/workflows/ap-rs0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ap-rs0:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis dependencies
        run: python -m pip install --upgrade pip pandas numpy
      - name: Run preregistered AP-RS0
        run: python experiments/ap_rs0_title_semantic_progress.py
      - name: Upload AP-RS0 results
        uses: actions/upload-artifact@v4
        with:
          name: ap-rs0-results
          path: artifacts/ap_rs0/
          if-no-files-found: error
