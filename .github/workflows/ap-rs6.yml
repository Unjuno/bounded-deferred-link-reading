name: AP-RS6 visible-only real anchor-context policy

on:
  push:
    branches: [main]
    paths:
      - 'experiments/ap_rs6_visible_only_policy.py'
      - '.github/workflows/ap-rs6.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ap-rs6:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy beautifulsoup4 lxml sentence-transformers scikit-learn
      - name: Run AP-RS6
        run: python experiments/ap_rs6_visible_only_policy.py
      - name: Stage results
        run: |
          cp artifacts/ap_rs6/AP_RS6_RESULTS.json results/AP_RS6_RESULTS.json
          cp artifacts/ap_rs6/AP_RS6_SUMMARY.md docs/AP_RS6_SUMMARY.md
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/AP_RS6_RESULTS.json docs/AP_RS6_SUMMARY.md
          git diff --cached --quiet || git commit -m "Add AP-RS6 visible-only real-semantic results"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: ap-rs6-results
          path: artifacts/ap_rs6/
          if-no-files-found: error
