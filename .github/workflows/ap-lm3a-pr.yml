name: AP-LM3A grounded text pilot

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/ap_lm3a_grounded_text.py'
      - 'docs/AP_LM3A_GROUNDED_TEXT_PLAN.md'
      - '.github/workflows/ap-lm3a-pr.yml'

jobs:
  ap-lm3a-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pandas beautifulsoup4 lxml sentence-transformers scikit-learn
      - name: Run AP-LM3A pilot
        run: PYTHONPATH=. python experiments/ap_lm3a_grounded_text.py --phase pilot
      - name: Upload pilot artifact
        uses: actions/upload-artifact@v4
        with:
          name: ap-lm3a-pilot-results
          path: |
            artifacts/ap_lm3a/AP_LM3A_PILOT_RESULTS.json
            artifacts/ap_lm3a/AP_LM3A_PILOT_SUMMARY.md
          if-no-files-found: error
