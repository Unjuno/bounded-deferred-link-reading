name: AP-RS7 monitored PR run

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/ap_rs7_finished_vs_unfinished_back.py'
      - '.github/workflows/ap-rs7-pr.yml'

permissions:
  contents: read

jobs:
  ap-rs7-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy sentence-transformers
      - name: Run AP-RS7
        run: python -m experiments.ap_rs7_finished_vs_unfinished_back
      - uses: actions/upload-artifact@v4
        with:
          name: ap-rs7-monitored-results
          path: artifacts/ap_rs7/
          if-no-files-found: error
