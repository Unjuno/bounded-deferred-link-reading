name: AP-RS7 monitored anchor-only buffer diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/ap_rs7_anchor_only_buffer_diagnostic.py'
      - '.github/workflows/ap-rs7-pr.yml'

permissions:
  contents: read

jobs:
  ap-rs7-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy beautifulsoup4 lxml sentence-transformers scikit-learn
      - name: Run AP-RS7
        run: python -m experiments.ap_rs7_anchor_only_buffer_diagnostic
      - uses: actions/upload-artifact@v4
        with:
          name: ap-rs7-monitored-results
          path: |
            artifacts/ap_rs7/AP_RS7_RESULTS.json
            artifacts/ap_rs7/AP_RS7_SUMMARY.md
            artifacts/ap_rs7/test_rows_learned.csv
          if-no-files-found: error
