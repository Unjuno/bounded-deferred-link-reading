name: AP-RS9 monitored PR run

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/ap_rs9_wrong_turn_triggered_policy.py'
      - '.github/workflows/ap-rs9-pr.yml'

permissions:
  contents: read

jobs:
  ap-rs9-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy beautifulsoup4 lxml sentence-transformers scikit-learn
      - name: Run AP-RS9
        run: python -m experiments.ap_rs9_wrong_turn_triggered_policy
      - uses: actions/upload-artifact@v4
        with:
          name: ap-rs9-monitored-results
          path: |
            artifacts/ap_rs9/AP_RS9_RESULTS.json
            artifacts/ap_rs9/AP_RS9_SUMMARY.md
            artifacts/ap_rs9/test_rows.csv
          if-no-files-found: error
