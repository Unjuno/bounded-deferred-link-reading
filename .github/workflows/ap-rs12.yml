name: AP-RS12 anchor oracle capacity

on:
  push:
    branches: [main]
    paths:
      - 'experiments/ap_rs12_anchor_oracle_buffer_capacity.py'
      - '.github/workflows/ap-rs12.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ap-rs12:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy beautifulsoup4 lxml sentence-transformers
      - name: Run AP-RS12
        run: python -m experiments.ap_rs12_anchor_oracle_buffer_capacity
      - name: Stage results
        run: |
          cp artifacts/ap_rs12/AP_RS12_RESULTS.json results/AP_RS12_RESULTS.json
          cp artifacts/ap_rs12/AP_RS12_SUMMARY.md docs/AP_RS12_SUMMARY.md
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/AP_RS12_RESULTS.json docs/AP_RS12_SUMMARY.md
          git diff --cached --quiet || git commit -m "Add AP-RS12 anchor oracle capacity results"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: ap-rs12-results
          path: |
            artifacts/ap_rs12/AP_RS12_RESULTS.json
            artifacts/ap_rs12/AP_RS12_SUMMARY.md
          if-no-files-found: error
