name: AP-RS4 monitored PR run

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/ap_rs4_article_body_semantics.py'
      - '.github/workflows/ap-rs4-pr.yml'

permissions:
  contents: read

jobs:
  ap-rs4-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy sentence-transformers
      - name: Run AP-RS4
        run: python experiments/ap_rs4_article_body_semantics.py
      - uses: actions/upload-artifact@v4
        with:
          name: ap-rs4-monitored-results
          path: artifacts/ap_rs4/
          if-no-files-found: error
