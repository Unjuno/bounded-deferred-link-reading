name: AP-RS4 article body semantic diagnostic

on:
  push:
    branches: [main]
    paths:
      - 'experiments/ap_rs4_article_body_semantics.py'
      - '.github/workflows/ap-rs4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ap-rs4:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy sentence-transformers
      - name: Run AP-RS4
        run: python experiments/ap_rs4_article_body_semantics.py
      - name: Stage results
        run: |
          cp artifacts/ap_rs4/AP_RS4_RESULTS.json results/AP_RS4_RESULTS.json
          cp artifacts/ap_rs4/AP_RS4_SUMMARY.md docs/AP_RS4_SUMMARY.md
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/AP_RS4_RESULTS.json docs/AP_RS4_SUMMARY.md
          git diff --cached --quiet || git commit -m "Add AP-RS4 article-body semantic results"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: ap-rs4-results
          path: artifacts/ap_rs4/
          if-no-files-found: error
