name: AP-RS7 finished-vs-unfinished human BACK

on:
  push:
    branches: [main]
    paths:
      - 'experiments/ap_rs7_finished_vs_unfinished_back.py'
      - '.github/workflows/ap-rs7.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ap-rs7:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy sentence-transformers
      - name: Run AP-RS7
        run: python -m experiments.ap_rs7_finished_vs_unfinished_back
      - name: Stage results
        run: |
          cp artifacts/ap_rs7/AP_RS7_RESULTS.json results/AP_RS7_RESULTS.json
          cp artifacts/ap_rs7/AP_RS7_SUMMARY.md docs/AP_RS7_SUMMARY.md
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/AP_RS7_RESULTS.json docs/AP_RS7_SUMMARY.md
          git diff --cached --quiet || git commit -m "Add AP-RS7 finished-vs-unfinished results"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: ap-rs7-results
          path: artifacts/ap_rs7/
          if-no-files-found: error
