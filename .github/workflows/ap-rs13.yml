name: AP-RS13 K1 semantic trigger

on:
  push:
    branches: [main]
    paths:
      - 'experiments/ap_rs13_k1_trigger_semantic_state.py'
      - '.github/workflows/ap-rs13.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ap-rs13:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pandas beautifulsoup4 lxml sentence-transformers scikit-learn
      - name: Run AP-RS13
        run: python -m experiments.ap_rs13_k1_trigger_semantic_state
      - name: Stage results
        run: |
          cp artifacts/ap_rs13/AP_RS13_RESULTS.json results/AP_RS13_RESULTS.json
          cp artifacts/ap_rs13/AP_RS13_SUMMARY.md docs/AP_RS13_SUMMARY.md
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/AP_RS13_RESULTS.json docs/AP_RS13_SUMMARY.md
          git diff --cached --quiet || git commit -m "Add AP-RS13 K1 semantic trigger results"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: ap-rs13-results
          path: |
            artifacts/ap_rs13/AP_RS13_RESULTS.json
            artifacts/ap_rs13/AP_RS13_SUMMARY.md
          if-no-files-found: error
