name: AP-RS1-RS2 human BACK semantics

on:
  push:
    branches: [main]
    paths:
      - 'experiments/ap_rs1_rs2_human_backtrack_semantics.py'
      - '.github/workflows/ap-rs1-rs2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ap-rs1-rs2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy
      - name: Run AP-RS1/RS2
        run: python experiments/ap_rs1_rs2_human_backtrack_semantics.py
      - name: Stage results
        run: |
          cp artifacts/ap_rs1_rs2/AP_RS1_RS2_RESULTS.json results/AP_RS1_RS2_RESULTS.json
          cp artifacts/ap_rs1_rs2/AP_RS1_RS2_SUMMARY.md docs/AP_RS1_RS2_SUMMARY.md
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/AP_RS1_RS2_RESULTS.json docs/AP_RS1_RS2_SUMMARY.md
          git diff --cached --quiet || git commit -m "Add AP-RS1/RS2 human BACK semantic results"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: ap-rs1-rs2-results
          path: artifacts/ap_rs1_rs2/
          if-no-files-found: error
