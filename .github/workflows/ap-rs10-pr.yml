name: AP-RS10 monitored PR run

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/ap_rs10_bounded_visited_memory_audit.py'
      - '.github/workflows/ap-rs10-pr.yml'

permissions:
  contents: read

jobs:
  ap-rs10-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy beautifulsoup4 lxml sentence-transformers
      - name: Run AP-RS10
        run: python -m experiments.ap_rs10_bounded_visited_memory_audit
      - uses: actions/upload-artifact@v4
        with:
          name: ap-rs10-monitored-results
          path: |
            artifacts/ap_rs10/AP_RS10_RESULTS.json
            artifacts/ap_rs10/AP_RS10_SUMMARY.md
          if-no-files-found: error
